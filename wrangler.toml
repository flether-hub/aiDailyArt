name = "ai-art-gallery"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

[vars]
# Add these in Cloudflare Dashboard -> Workers & Pages -> Functions -> Variables
# ADMIN_PASSWORD = "..."
# GEMINI_API_KEY = "..."
# APP_URL = "https://your-app.pages.dev"

[[d1_databases]]
binding = "ART_GALLERY_DB"
database_name = "art_db"
database_id = "your-d1-id"

[[r2_buckets]]
binding = "ART_GALLERY_IMAGES"
bucket_name = "art-images"
