name = "ai-art-gallery"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
# Add these in Cloudflare Dashboard -> Workers & Pages -> Functions -> Variables
# ADMIN_PASSWORD = "..."
# APP_URL = "https://aidailyart.pages.dev"

[[d1_databases]]
binding = "ART_GALLERY_DB"
database_name = "art_db"
database_id = "a23c6453-9283-45b7-8e7c-793f3c3b63a7"

[[r2_buckets]]
binding = "ART_GALLERY_IMAGES"
bucket_name = "art-images"
